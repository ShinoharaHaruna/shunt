[package]
name = "shunt"
version = "0.9.0"
edition = "2021"
license = "MIT"
description = "Experiment queues, machine management, and agent coordination over SSH or locally"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.11"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"
tungstenite = "0.30.0"
