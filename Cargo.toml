[package]
name = "shunt"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Zero-dependency experiment queue for hourly-billed GPU boxes"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.11"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"
