<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title description">
  <title id="title">shunt filesystem task lifecycle and idle shutdown</title>
  <desc id="description">A pending task is claimed by rename into running, then finishes in done for success or failed for failure, killing, or timeout. On daemon restart, orphaned running tasks return to the front of pending. When armed, idle shutdown waits for pending and running to drain before a grace countdown and a configured poweroff command. New work cancels the countdown and busy sibling queues block poweroff.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697575"/></marker>
    <marker id="recover" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb6238"/></marker>
  </defs>
  <rect width="1200" height="540" rx="20" fill="#f8f6f1"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#1d292c">
    <text x="44" y="60" font-size="32" font-weight="700">Every task has a place.</text>
    <text x="44" y="94" font-size="19" fill="#586565">Four directories, inspectable logs, and explicit recovery.</text>
    <rect x="44" y="164" width="280" height="112" rx="14" fill="#ffffff" stroke="#cdd4d1" stroke-width="2"/>
    <text x="68" y="206" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700">pending/</text>
    <text x="68" y="245" font-size="19" fill="#586565">Waiting to be claimed</text>
    <rect x="448" y="164" width="280" height="112" rx="14" fill="#e7eeeb" stroke="#24776b" stroke-width="2"/>
    <text x="472" y="206" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700" fill="#1d665c">running/</text>
    <text x="472" y="245" font-size="19" fill="#586565">Isolated process group</text>
    <rect x="904" y="126" width="252" height="100" rx="14" fill="#e7eeeb" stroke="#c5d8ce" stroke-width="2"/>
    <text x="928" y="165" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="700" fill="#1d665c">done/</text>
    <text x="928" y="200" font-size="18" fill="#586565">Successful exit</text>
    <rect x="904" y="286" width="252" height="100" rx="14" fill="#f7eae2" stroke="#e2c7b7" stroke-width="2"/>
    <text x="928" y="325" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="700" fill="#9b4a28">failed/</text>
    <text x="928" y="359" font-size="17" fill="#79594a">Error, kill, or timeout</text>
    <path d="M 336 220 H 432" fill="none" stroke="#697575" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="384" y="201" font-size="17" text-anchor="middle" fill="#586565">rename</text>
    <path d="M 740 196 H 816 V 176 H 888" fill="none" stroke="#697575" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="812" y="151" font-size="17" text-anchor="middle" fill="#586565">exit 0</text>
    <path d="M 740 244 H 816 V 336 H 888" fill="none" stroke="#697575" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 588 290 V 330 Q 588 344 574 344 H 198 Q 184 344 184 330 V 290" fill="none" stroke="#bb6238" stroke-width="2.5" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#recover)"/>
    <text x="44" y="382" font-size="18" fill="#9b4a28">Daemon restart: requeue orphaned running entries at the front.</text>
    <line x1="44" y1="422" x2="1156" y2="422" stroke="#d9ddda"/>
    <circle cx="52" cy="458" r="6" fill="#bb6238"/>
    <text x="72" y="465" font-size="20" font-weight="700">When armed: queue drained → grace countdown → configured poweroff</text>
    <text x="72" y="500" font-size="18" fill="#586565">New work cancels the countdown. Busy sibling queues block poweroff.</text>
  </g>
</svg>
