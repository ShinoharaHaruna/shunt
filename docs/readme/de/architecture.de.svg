<svg lang="de" xml:lang="de" xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">shunt-Architektur: eine Programmdatei für lokale und entfernte Experimentrechner</title>
  <desc id="description">Der Entwicklungsrechner speichert Clients, benannte Warteschlangen und Projekte im Register, hält Aufgaben dauerhaft im Auftragsspeicher vor und stellt sie einer festgelegten Warteschlange zu. Koordinationsräume speichern Projektabsprachen; das Aufgabenprotokoll bewahrt den Zustellungs- und Ergebnisverlauf. SSH oder ein lokaler Prozessaufruf überträgt Aufgaben und Befehle an einen Experimentrechner und liefert JSON zurück. Jede benannte Warteschlange besitzt eigene Zustandsverzeichnisse, einen Daemon, Worker und eine Umgebung. Solange der Rechner nicht erreichbar ist, bleiben die Aufgaben zur Zustellung vorgemerkt. Das Beenden des Daemons und das Abschalten des Rechners bei Leerlauf sind optional.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24776b"/></marker>
    <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697575"/></marker>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#f8f6f1"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#1d292c">
    <text x="44" y="60" font-size="32" font-weight="700">Ein Programm. Lokal und auf entfernten Rechnern.</text>
    <text x="44" y="94" font-size="19" fill="#586565">Dauerhaft vorgemerkte Aufgaben, klare Zielwahl und unabhängige Queues.</text>
    <rect x="44" y="130" width="430" height="354" rx="16" fill="#ffffff" stroke="#d9ddda" stroke-width="2"/>
    <path d="M 60 130 H 458 Q 474 130 474 146 V 194 H 44 V 146 Q 44 130 60 130" fill="#e9edeb"/>
    <text x="72" y="169" font-size="20" font-weight="700">01 / ENTWICKLUNGSRECHNER</text>
    <rect x="726" y="130" width="430" height="354" rx="16" fill="#ffffff" stroke="#d9ddda" stroke-width="2"/>
    <path d="M 742 130 H 1140 Q 1156 130 1156 146 V 194 H 726 V 146 Q 726 130 742 130" fill="#e3eeea"/>
    <text x="754" y="169" font-size="20" font-weight="700">02 / EXPERIMENTRECHNER</text>
    <circle cx="80" cy="219" r="5" fill="#bb6238"/>
    <text x="98" y="227" font-size="23" font-weight="700">Register</text>
    <text x="98" y="254" font-size="18" fill="#586565">Clients, benannte Queues und Projekte</text>
    <line x1="72" y1="273" x2="446" y2="273" stroke="#e7eae6"/>
    <circle cx="80" cy="291" r="5" fill="#bb6238"/>
    <text x="98" y="299" font-size="23" font-weight="700">Auftragsspeicher</text>
    <text x="98" y="326" font-size="17" fill="#586565">Aufgaben bis zur Bestätigung vorhalten</text>
    <line x1="72" y1="345" x2="446" y2="345" stroke="#e7eae6"/>
    <circle cx="80" cy="363" r="5" fill="#bb6238"/>
    <text x="98" y="371" font-size="23" font-weight="700">Verteiler</text>
    <text x="98" y="398" font-size="18" fill="#586565">Zustellung und Daemon-Wiederanlauf</text>
    <line x1="72" y1="417" x2="446" y2="417" stroke="#e7eae6"/>
    <circle cx="80" cy="435" r="5" fill="#bb6238"/>
    <text x="98" y="443" font-size="21" font-weight="700">Räume + Aufgabenprotokoll</text>
    <text x="98" y="470" font-size="18" fill="#586565">Absprachen und Aufgabenverlauf</text>
    <rect x="754" y="212" width="374" height="104" rx="10" fill="#f4f8f5" stroke="#d9e4dd"/>
    <text x="774" y="243" font-size="22" font-weight="700" fill="#1d665c">Queue / train</text>
    <text x="774" y="273" font-size="17" fill="#586565">qroot, Daemon, Worker, env je Queue</text>
    <text x="774" y="298" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#586565">pending/ running/ done/ failed/</text>
    <rect x="754" y="330" width="374" height="104" rx="10" fill="#f4f8f5" stroke="#d9e4dd"/>
    <text x="774" y="361" font-size="22" font-weight="700" fill="#1d665c">Queue / eval</text>
    <text x="774" y="391" font-size="17" fill="#586565">qroot, Daemon, Worker, env je Queue</text>
    <text x="774" y="416" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#586565">pending/ running/ done/ failed/</text>
    <text x="941" y="464" font-size="17" text-anchor="middle" fill="#586565">Unabhängige Queues, eine Client-ID</text>
    <text x="600" y="260" font-size="20" font-weight="700" text-anchor="middle" fill="#24776b">SSH / lokale Ausf.</text>
    <path d="M 492 282 H 708" fill="none" stroke="#24776b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="310" font-size="17" text-anchor="middle" fill="#586565">Aufgaben + Befehle</text>
    <text x="600" y="363" font-size="20" font-weight="700" text-anchor="middle" fill="#586565">JSON-Antworten</text>
    <path d="M 708 382 H 492" fill="none" stroke="#697575" stroke-width="2.5" marker-end="url(#return)"/>
    <line x1="44" y1="518" x2="1156" y2="518" stroke="#d9ddda"/>
    <text x="44" y="551" font-size="18" fill="#586565">Workstation · Laborserver · Cloud-Instanz · CPU oder GPU</text>
    <text x="44" y="582" font-size="17" fill="#586565">Rechner offline? Aufgaben bleiben vorgemerkt.</text>
    <text x="1156" y="582" font-size="17" text-anchor="end" fill="#586565">Optional bei Leerlauf: Daemon beenden oder Rechner abschalten.</text>
  </g>
</svg>
