<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" lang="es" xml:lang="es" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura de shunt: un binario para equipos de experimentación locales o remotos</title>
  <desc id="description">El equipo de desarrollo guarda las máquinas, las colas con nombre y los proyectos en el registro, conserva las tareas en el área de espera y las envía a la cola fijada al enviarlas. Las salas de coordinación conservan los acuerdos de los proyectos y el historial de tareas registra la entrega y sus resultados. SSH o la ejecución local envían tareas y comandos al equipo de experimentación y devuelven JSON. Cada cola con nombre tiene sus propios directorios de estado, daemon, workers y entorno. Si el equipo no está disponible, las tareas siguen guardadas. Tanto la salida del daemon como el apagado del equipo al quedar inactivos son opcionales.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24776b"/></marker>
    <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697575"/></marker>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#f8f6f1"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#1d292c">
    <text x="44" y="60" font-size="32" font-weight="700">Un binario. En local y en remoto.</text>
    <text x="44" y="94" font-size="19" fill="#586565">Tareas persistentes, destino explícito y colas independientes.</text>
    <rect x="44" y="130" width="430" height="354" rx="16" fill="#ffffff" stroke="#d9ddda" stroke-width="2"/>
    <path d="M 60 130 H 458 Q 474 130 474 146 V 194 H 44 V 146 Q 44 130 60 130" fill="#e9edeb"/>
    <text x="72" y="169" font-size="20" font-weight="700">01 / EQUIPO DE DESARROLLO</text>
    <rect x="726" y="130" width="430" height="354" rx="16" fill="#ffffff" stroke="#d9ddda" stroke-width="2"/>
    <path d="M 742 130 H 1140 Q 1156 130 1156 146 V 194 H 726 V 146 Q 726 130 742 130" fill="#e3eeea"/>
    <text x="754" y="169" font-size="20" font-weight="700">02 / EQUIPO DE EXPERIMENTOS</text>
    <circle cx="80" cy="219" r="5" fill="#bb6238"/>
    <text x="98" y="227" font-size="23" font-weight="700">Registro</text>
    <text x="98" y="254" font-size="16.5" fill="#586565">Máquinas, colas con nombre y proyectos</text>
    <line x1="72" y1="273" x2="446" y2="273" stroke="#e7eae6"/>
    <circle cx="80" cy="291" r="5" fill="#bb6238"/>
    <text x="98" y="299" font-size="23" font-weight="700">Área de espera</text>
    <text x="98" y="326" font-size="17" fill="#586565">Tareas guardadas hasta su confirmación</text>
    <line x1="72" y1="345" x2="446" y2="345" stroke="#e7eae6"/>
    <circle cx="80" cy="363" r="5" fill="#bb6238"/>
    <text x="98" y="371" font-size="23" font-weight="700">Distribuidor</text>
    <text x="98" y="398" font-size="18" fill="#586565">Envía tareas y reactiva los daemons</text>
    <line x1="72" y1="417" x2="446" y2="417" stroke="#e7eae6"/>
    <circle cx="80" cy="435" r="5" fill="#bb6238"/>
    <text x="98" y="443" font-size="23" font-weight="700">Salas + historial de tareas</text>
    <text x="98" y="470" font-size="18" fill="#586565">Acuerdos de proyectos e historial</text>
    <rect x="754" y="212" width="374" height="104" rx="10" fill="#f4f8f5" stroke="#d9e4dd"/>
    <text x="774" y="243" font-size="22" font-weight="700" fill="#1d665c">Cola / train</text>
    <text x="774" y="273" font-size="15.5" fill="#586565">qroot, daemon, workers y entorno propios</text>
    <text x="774" y="298" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#586565">pending/ running/ done/ failed/</text>
    <rect x="754" y="330" width="374" height="104" rx="10" fill="#f4f8f5" stroke="#d9e4dd"/>
    <text x="774" y="361" font-size="22" font-weight="700" fill="#1d665c">Cola / eval</text>
    <text x="774" y="391" font-size="15.5" fill="#586565">qroot, daemon, workers y entorno propios</text>
    <text x="774" y="416" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#586565">pending/ running/ done/ failed/</text>
    <text x="941" y="464" font-size="17" text-anchor="middle" fill="#586565">Colas independientes, una identidad de cliente</text>
    <text x="600" y="260" font-size="18" font-weight="700" text-anchor="middle" fill="#24776b">SSH / ejecución local</text>
    <path d="M 492 282 H 708" fill="none" stroke="#24776b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="310" font-size="17" text-anchor="middle" fill="#586565">Tareas + comandos</text>
    <text x="600" y="363" font-size="20" font-weight="700" text-anchor="middle" fill="#586565">Respuestas JSON</text>
    <path d="M 708 382 H 492" fill="none" stroke="#697575" stroke-width="2.5" marker-end="url(#return)"/>
    <line x1="44" y1="518" x2="1156" y2="518" stroke="#d9ddda"/>
    <text x="44" y="551" font-size="18" fill="#586565">Estación de trabajo · Servidor de laboratorio · Nube · CPU o GPU</text>
    <text x="44" y="582" font-size="17" fill="#586565">Equipo sin conexión: las tareas siguen guardadas.</text>
    <text x="1156" y="582" font-size="17" text-anchor="end" fill="#586565">Opcional: salir del daemon o apagar el equipo al quedar inactivo.</text>
  </g>
</svg>
