<svg lang="fr" xml:lang="fr" xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Architecture de shunt : un seul binaire, des machines d’expérimentation locales ou distantes</title>
  <desc id="description">La machine de développement conserve les clients, les files nommées et les projets dans le registre, stocke les tâches dans le spool et les envoie à une file fixée à l’avance. Les salons de coordination conservent les accords du projet, et le journal des tâches garde l’historique des livraisons et des résultats. SSH ou une exécution locale transmet les tâches et les commandes à une machine d’expérimentation et renvoie du JSON. Chaque file nommée possède ses propres répertoires d’état, démon, processus d’exécution et environnement. Les tâches restent en attente d’envoi tant que la machine est inaccessible. La sortie du démon inactif et l’arrêt de la machine inactive sont facultatifs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24776b"/></marker>
    <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697575"/></marker>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#f8f6f1"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#1d292c">
    <text x="44" y="60" font-size="32" font-weight="700">Un seul binaire. En local et à distance.</text>
    <text x="44" y="94" font-size="19" fill="#586565">Tâches persistantes, routage explicite et files d’exécution indépendantes.</text>
    <rect x="44" y="130" width="430" height="354" rx="16" fill="#ffffff" stroke="#d9ddda" stroke-width="2"/>
    <path d="M 60 130 H 458 Q 474 130 474 146 V 194 H 44 V 146 Q 44 130 60 130" fill="#e9edeb"/>
    <text x="72" y="169" font-size="18" font-weight="700">01 / MACHINE DE DÉVELOPPEMENT</text>
    <rect x="726" y="130" width="430" height="354" rx="16" fill="#ffffff" stroke="#d9ddda" stroke-width="2"/>
    <path d="M 742 130 H 1140 Q 1156 130 1156 146 V 194 H 726 V 146 Q 726 130 742 130" fill="#e3eeea"/>
    <text x="754" y="169" font-size="18" font-weight="700">02 / MACHINE D’EXPÉRIMENTATION</text>
    <circle cx="80" cy="219" r="5" fill="#bb6238"/>
    <text x="98" y="227" font-size="23" font-weight="700">Registre</text>
    <text x="98" y="254" font-size="18" fill="#586565">Clients, files nommées et projets</text>
    <line x1="72" y1="273" x2="446" y2="273" stroke="#e7eae6"/>
    <circle cx="80" cy="291" r="5" fill="#bb6238"/>
    <text x="98" y="299" font-size="23" font-weight="700">Stockage des tâches</text>
    <text x="98" y="326" font-size="17" fill="#586565">Conserver les tâches jusqu’à confirmation</text>
    <line x1="72" y1="345" x2="446" y2="345" stroke="#e7eae6"/>
    <circle cx="80" cy="363" r="5" fill="#bb6238"/>
    <text x="98" y="371" font-size="23" font-weight="700">Répartiteur</text>
    <text x="98" y="398" font-size="18" fill="#586565">Livraison et relance des démons</text>
    <line x1="72" y1="417" x2="446" y2="417" stroke="#e7eae6"/>
    <circle cx="80" cy="435" r="5" fill="#bb6238"/>
    <text x="98" y="443" font-size="22" font-weight="700">Salons + journal des tâches</text>
    <text x="98" y="470" font-size="18" fill="#586565">Accords du projet et historique</text>
    <rect x="754" y="212" width="374" height="104" rx="10" fill="#f4f8f5" stroke="#d9e4dd"/>
    <text x="774" y="243" font-size="22" font-weight="700" fill="#1d665c">File / train</text>
    <text x="774" y="273" font-size="17" fill="#586565">qroot, démon, processus, env dédiés</text>
    <text x="774" y="298" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#586565">pending/ running/ done/ failed/</text>
    <rect x="754" y="330" width="374" height="104" rx="10" fill="#f4f8f5" stroke="#d9e4dd"/>
    <text x="774" y="361" font-size="22" font-weight="700" fill="#1d665c">File / eval</text>
    <text x="774" y="391" font-size="17" fill="#586565">qroot, démon, processus, env dédiés</text>
    <text x="774" y="416" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#586565">pending/ running/ done/ failed/</text>
    <text x="941" y="464" font-size="17" text-anchor="middle" fill="#586565">Files indépendantes, un seul client</text>
    <text x="600" y="260" font-size="20" font-weight="700" text-anchor="middle" fill="#24776b">SSH / exéc. locale</text>
    <path d="M 492 282 H 708" fill="none" stroke="#24776b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="310" font-size="17" text-anchor="middle" fill="#586565">Tâches + commandes</text>
    <text x="600" y="363" font-size="20" font-weight="700" text-anchor="middle" fill="#586565">Réponses JSON</text>
    <path d="M 708 382 H 492" fill="none" stroke="#697575" stroke-width="2.5" marker-end="url(#return)"/>
    <line x1="44" y1="518" x2="1156" y2="518" stroke="#d9ddda"/>
    <text x="44" y="551" font-size="18" fill="#586565">Station de travail · Serveur de labo · Instance cloud · CPU ou GPU</text>
    <text x="44" y="582" font-size="17" fill="#586565">Machine hors ligne ? Les tâches attendent.</text>
    <text x="1156" y="582" font-size="17" text-anchor="end" fill="#586565">Option : sortie du démon ou arrêt de la machine inactive.</text>
  </g>
</svg>
