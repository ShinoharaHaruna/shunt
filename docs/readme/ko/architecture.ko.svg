<svg xmlns="http://www.w3.org/2000/svg" lang="ko" xml:lang="ko" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">shunt 구조: 하나의 바이너리로 로컬 및 원격 실험 머신 운영</title>
  <desc id="description">개발 머신은 클라이언트, 이름 있는 큐, 프로젝트를 레지스트리에 저장하고 작업을 스풀에 영속적으로 보관한 뒤 고정된 큐로 전달합니다. 협업 룸은 프로젝트의 합의 사항을 보관하고 작업 원장은 전달 및 실행 결과의 이력을 기록합니다. SSH 또는 로컬 실행으로 실험 머신에 작업과 명령을 보내고 JSON 응답을 받습니다. 각 큐에는 독립된 파일시스템 상태 디렉터리, 데몬, 워커, 환경이 있습니다. 머신에 연결할 수 없는 동안에도 작업은 전송 대기 상태로 보관됩니다. 유휴 데몬 종료와 유휴 머신 종료는 선택적으로 활성화할 수 있습니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24776b"/></marker>
    <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697575"/></marker>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#f8f6f1"/>
  <g font-family="Noto Sans CJK KR, Noto Sans, DejaVu Sans, sans-serif" fill="#1d292c">
    <text x="44" y="60" font-size="32" font-weight="700">하나의 바이너리. 로컬과 원격 모두.</text>
    <text x="44" y="94" font-size="19" fill="#586565">작업 영속 보관, 명시적인 전달 경로, 독립적인 실행 큐.</text>
    <rect x="44" y="130" width="430" height="354" rx="16" fill="#ffffff" stroke="#d9ddda" stroke-width="2"/>
    <path d="M 60 130 H 458 Q 474 130 474 146 V 194 H 44 V 146 Q 44 130 60 130" fill="#e9edeb"/>
    <text x="72" y="169" font-size="20" font-weight="700">01 / 개발 머신</text>
    <rect x="726" y="130" width="430" height="354" rx="16" fill="#ffffff" stroke="#d9ddda" stroke-width="2"/>
    <path d="M 742 130 H 1140 Q 1156 130 1156 146 V 194 H 726 V 146 Q 726 130 742 130" fill="#e3eeea"/>
    <text x="754" y="169" font-size="20" font-weight="700">02 / 실험 머신</text>
    <circle cx="80" cy="219" r="5" fill="#bb6238"/>
    <text x="98" y="227" font-size="23" font-weight="700">레지스트리</text>
    <text x="98" y="254" font-size="18" fill="#586565">클라이언트, 이름 있는 큐, 프로젝트</text>
    <line x1="72" y1="273" x2="446" y2="273" stroke="#e7eae6"/>
    <circle cx="80" cy="291" r="5" fill="#bb6238"/>
    <text x="98" y="299" font-size="23" font-weight="700">작업 스풀</text>
    <text x="98" y="326" font-size="18" fill="#586565">수신 확인까지 작업을 영속 보관</text>
    <line x1="72" y1="345" x2="446" y2="345" stroke="#e7eae6"/>
    <circle cx="80" cy="363" r="5" fill="#bb6238"/>
    <text x="98" y="371" font-size="23" font-weight="700">디스패처</text>
    <text x="98" y="398" font-size="18" fill="#586565">작업 전달 및 각 큐 데몬 복구</text>
    <line x1="72" y1="417" x2="446" y2="417" stroke="#e7eae6"/>
    <circle cx="80" cy="435" r="5" fill="#bb6238"/>
    <text x="98" y="443" font-size="23" font-weight="700">협업 룸 + 작업 원장</text>
    <text x="98" y="470" font-size="18" fill="#586565">프로젝트 합의 사항 및 작업 이력</text>
    <rect x="754" y="212" width="374" height="104" rx="10" fill="#f4f8f5" stroke="#d9e4dd"/>
    <text x="774" y="243" font-size="22" font-weight="700" fill="#1d665c">큐 / train</text>
    <text x="774" y="273" font-size="15" fill="#586565">독립된 qroot, 데몬, 워커, 환경</text>
    <text x="774" y="298" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#586565">pending/ running/ done/ failed/</text>
    <rect x="754" y="330" width="374" height="104" rx="10" fill="#f4f8f5" stroke="#d9e4dd"/>
    <text x="774" y="361" font-size="22" font-weight="700" fill="#1d665c">큐 / eval</text>
    <text x="774" y="391" font-size="15" fill="#586565">독립된 qroot, 데몬, 워커, 환경</text>
    <text x="774" y="416" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#586565">pending/ running/ done/ failed/</text>
    <text x="941" y="464" font-size="17" text-anchor="middle" fill="#586565">독립된 큐, 하나의 클라이언트 ID</text>
    <text x="600" y="260" font-size="20" font-weight="700" text-anchor="middle" fill="#24776b">SSH / 로컬 실행</text>
    <path d="M 492 282 H 708" fill="none" stroke="#24776b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="310" font-size="17" text-anchor="middle" fill="#586565">작업 + 명령</text>
    <text x="600" y="363" font-size="20" font-weight="700" text-anchor="middle" fill="#586565">JSON 응답</text>
    <path d="M 708 382 H 492" fill="none" stroke="#697575" stroke-width="2.5" marker-end="url(#return)"/>
    <line x1="44" y1="518" x2="1156" y2="518" stroke="#d9ddda"/>
    <text x="44" y="551" font-size="18" fill="#586565">워크스테이션 · 연구실 서버 · 클라우드 인스턴스 · CPU / GPU</text>
    <text x="44" y="582" font-size="17" fill="#586565">머신이 오프라인이어도 작업은 보관됩니다.</text>
    <text x="1156" y="582" font-size="17" text-anchor="end" fill="#586565">선택 사항: 유휴 데몬 종료 또는 머신 종료.</text>
  </g>
</svg>
