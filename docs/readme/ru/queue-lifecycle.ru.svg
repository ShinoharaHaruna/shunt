<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" lang="ru" xml:lang="ru" role="img" aria-labelledby="title description">
  <title id="title">Жизненный цикл и восстановление задач в каждой очереди shunt</title>
  <desc id="description">У каждой именованной очереди независимые каталоги состояния. Задача из pending захватывается переименованием и переносится в running; успешные задачи попадают в done, а окончательные сбои — в failed. Явно заданный лимит повторов позволяет повторно запускать задачи с rc 75 или распознанной нехваткой памяти (OOM); ошибки вне этих условий и исчерпанные повторы окончательны. В failed также попадают задачи с превышенным временем выполнения. При перезапуске демона осиротевшие задачи из running возвращаются в начало pending. Когда очередь пуста, демон может оставаться активным или штатно завершаться по настройке. Выключение машины при простое включается отдельно и ожидает окончания льготного отсчёта. Перед включением сервер проверяет все зарегистрированные очереди этой машины и отклоняет общие машины. Во время работы проверяются только живые демоны соседних очередей того же Unix-пользователя, а не вся нагрузка машины; новые задачи отменяют отсчёт.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697575"/></marker>
    <marker id="recover" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb6238"/></marker>
  </defs>
  <rect width="1200" height="620" rx="20" fill="#f8f6f1"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#1d292c">
    <text x="44" y="60" font-size="32" font-weight="700">У каждой задачи — своё место.</text>
    <text x="44" y="94" font-size="19" fill="#586565">Состояние каждой очереди, доступные логи и явное восстановление.</text>
    <text x="44" y="142" font-size="18" fill="#9b4a28">Перезапуск демона: осиротевшие задачи возвращаются в начало очереди.</text>
    <path d="M 588 196 V 184 Q 588 170 574 170 H 198 Q 184 170 184 184 V 196" fill="none" stroke="#bb6238" stroke-width="2.5" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#recover)"/>
    <rect x="44" y="210" width="280" height="112" rx="14" fill="#ffffff" stroke="#cdd4d1" stroke-width="2"/>
    <text x="68" y="252" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700">pending/</text>
    <text x="68" y="291" font-size="19" fill="#586565">Ожидание запуска</text>
    <rect x="448" y="210" width="280" height="112" rx="14" fill="#e7eeeb" stroke="#24776b" stroke-width="2"/>
    <text x="472" y="252" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700" fill="#1d665c">running/</text>
    <text x="472" y="291" font-size="18.5" fill="#586565">Своя группа процессов</text>
    <rect x="904" y="170" width="252" height="100" rx="14" fill="#e7eeeb" stroke="#c5d8ce" stroke-width="2"/>
    <text x="928" y="209" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="700" fill="#1d665c">done/</text>
    <text x="928" y="244" font-size="18" fill="#586565">Успешный выход</text>
    <rect x="904" y="330" width="252" height="100" rx="14" fill="#f7eae2" stroke="#e2c7b7" stroke-width="2"/>
    <text x="928" y="369" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="700" fill="#9b4a28">failed/</text>
    <text x="928" y="403" font-size="17" fill="#79594a">Окончательный сбой</text>
    <path d="M 336 266 H 432" fill="none" stroke="#697575" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="384" y="247" font-size="17" text-anchor="middle" fill="#586565">переимен.</text>
    <path d="M 740 242 H 816 V 220 H 888" fill="none" stroke="#697575" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="812" y="195" font-size="17" text-anchor="middle" fill="#586565">exit 0</text>
    <path d="M 740 290 H 816 V 380 H 888" fill="none" stroke="#697575" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M 588 336 V 368 Q 588 382 574 382 H 198 Q 184 382 184 368 V 336" fill="none" stroke="#bb6238" stroke-width="2.5" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#recover)"/>
    <text x="44" y="420" font-size="18" fill="#9b4a28">Явный лимит повторов: rc 75 / распознанный OOM → повтор с задержкой.</text>
    <line x1="44" y1="468" x2="1156" y2="468" stroke="#d9ddda"/>
    <circle cx="52" cy="504" r="6" fill="#24776b"/>
    <text x="72" y="511" font-size="20" font-weight="700">Очередь пуста: демон остаётся активным или завершает работу по настройке.</text>
    <text x="72" y="550" font-size="18" fill="#586565">Опциональное выключение: отсчёт и проверка живых демонов соседних очередей того же пользователя.</text>
    <text x="72" y="585" font-size="18" fill="#586565">Новые задачи отменяют отсчёт. Для общих машин сервер не может включить выключение.</text>
  </g>
</svg>
