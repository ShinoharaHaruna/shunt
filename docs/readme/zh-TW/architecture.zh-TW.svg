<svg xmlns="http://www.w3.org/2000/svg" lang="zh-TW" xml:lang="zh-TW" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">shunt 架構：單一執行檔，本機與遠端實驗機器通用</title>
  <desc id="description">開發機器將用戶端、具名佇列與專案儲存於登錄資料庫，將任務持久儲存於暫存區，再派送至固定的佇列。協作室保存專案共識，任務紀錄保留派送及執行結果的歷程。透過 SSH 或本機執行，向實驗機器傳送任務與指令並接收 JSON 回應。每個具名佇列都有獨立的檔案系統狀態目錄、常駐程式、工作程序及執行環境。機器無法連線時，任務仍保留於暫存區等待派送。閒置時退出常駐程式及機器關機皆可選擇啟用。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24776b"/></marker>
    <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697575"/></marker>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#f8f6f1"/>
  <g font-family="Noto Sans CJK TC, Noto Sans, DejaVu Sans, sans-serif" fill="#1d292c">
    <text x="44" y="60" font-size="32" font-weight="700">單一執行檔，本機與遠端通用。</text>
    <text x="44" y="94" font-size="19" fill="#586565">任務持久暫存、明確的派送路徑、獨立的執行佇列。</text>
    <rect x="44" y="130" width="430" height="354" rx="16" fill="#ffffff" stroke="#d9ddda" stroke-width="2"/>
    <path d="M 60 130 H 458 Q 474 130 474 146 V 194 H 44 V 146 Q 44 130 60 130" fill="#e9edeb"/>
    <text x="72" y="169" font-size="20" font-weight="700">01 / 開發機器</text>
    <rect x="726" y="130" width="430" height="354" rx="16" fill="#ffffff" stroke="#d9ddda" stroke-width="2"/>
    <path d="M 742 130 H 1140 Q 1156 130 1156 146 V 194 H 726 V 146 Q 726 130 742 130" fill="#e3eeea"/>
    <text x="754" y="169" font-size="20" font-weight="700">02 / 實驗機器</text>
    <circle cx="80" cy="219" r="5" fill="#bb6238"/>
    <text x="98" y="227" font-size="23" font-weight="700">登錄資料庫</text>
    <text x="98" y="254" font-size="18" fill="#586565">用戶端、具名佇列與專案</text>
    <line x1="72" y1="273" x2="446" y2="273" stroke="#e7eae6"/>
    <circle cx="80" cy="291" r="5" fill="#bb6238"/>
    <text x="98" y="299" font-size="23" font-weight="700">任務暫存區</text>
    <text x="98" y="326" font-size="18" fill="#586565">收到確認前，持續保存任務</text>
    <line x1="72" y1="345" x2="446" y2="345" stroke="#e7eae6"/>
    <circle cx="80" cy="363" r="5" fill="#bb6238"/>
    <text x="98" y="371" font-size="23" font-weight="700">派送器</text>
    <text x="98" y="398" font-size="18" fill="#586565">派送任務並恢復各佇列的常駐程式</text>
    <line x1="72" y1="417" x2="446" y2="417" stroke="#e7eae6"/>
    <circle cx="80" cy="435" r="5" fill="#bb6238"/>
    <text x="98" y="443" font-size="23" font-weight="700">協作室 + 任務紀錄</text>
    <text x="98" y="470" font-size="18" fill="#586565">專案共識與任務歷程</text>
    <rect x="754" y="212" width="374" height="104" rx="10" fill="#f4f8f5" stroke="#d9e4dd"/>
    <text x="774" y="243" font-size="22" font-weight="700" fill="#1d665c">佇列 / train</text>
    <text x="774" y="273" font-size="15" fill="#586565">各自的 qroot、常駐程式、工作程序及環境</text>
    <text x="774" y="298" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#586565">pending/ running/ done/ failed/</text>
    <rect x="754" y="330" width="374" height="104" rx="10" fill="#f4f8f5" stroke="#d9e4dd"/>
    <text x="774" y="361" font-size="22" font-weight="700" fill="#1d665c">佇列 / eval</text>
    <text x="774" y="391" font-size="15" fill="#586565">各自的 qroot、常駐程式、工作程序及環境</text>
    <text x="774" y="416" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#586565">pending/ running/ done/ failed/</text>
    <text x="941" y="464" font-size="17" text-anchor="middle" fill="#586565">獨立佇列，共用用戶端身分</text>
    <text x="600" y="260" font-size="20" font-weight="700" text-anchor="middle" fill="#24776b">SSH / 本機執行</text>
    <path d="M 492 282 H 708" fill="none" stroke="#24776b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="310" font-size="17" text-anchor="middle" fill="#586565">任務 + 指令</text>
    <text x="600" y="363" font-size="20" font-weight="700" text-anchor="middle" fill="#586565">JSON 回應</text>
    <path d="M 708 382 H 492" fill="none" stroke="#697575" stroke-width="2.5" marker-end="url(#return)"/>
    <line x1="44" y1="518" x2="1156" y2="518" stroke="#d9ddda"/>
    <text x="44" y="551" font-size="18" fill="#586565">工作站 · 實驗室伺服器 · 雲端執行個體 · CPU / GPU</text>
    <text x="44" y="582" font-size="17" fill="#586565">機器離線時，任務仍保留於暫存區。</text>
    <text x="1156" y="582" font-size="17" text-anchor="end" fill="#586565">可選：閒置時退出常駐程式或關閉機器。</text>
  </g>
</svg>
