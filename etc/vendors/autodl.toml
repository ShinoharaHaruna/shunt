# Vendor template: AutoDL container instance.
# `shunt client add <name> --template autodl` seeds a client row from
# this file; ssh.key is generated automatically (keys/<name>), so only
# host/port (and optionally ssh.password / billing) need filling.
# After `add`, the row in ~/.config/shunt/clients/ stands alone.

name = "" # overwritten by `client add <name>`
qroot = "/root/autodl-tmp/queue" # queue dir on the box
deploy_root = "/root/autodl-tmp" # AutoDL's persistent data mount
expire = "metered" # AutoDL pay-as-you-go: runs until balance; subscription boxes write the deadline instead
endpoint_rotates = false # AutoDL keeps ssh.host/ssh.port stable across stop/start
# shell = "bash"      # task wrapper + env_setup shell (default bash)
# env_setup = """     # sourced before every task; push with `shunt client env <name>`
# source /root/miniconda3/etc/profile.d/conda.sh
# conda activate ribo
# """

[ssh]
host = "" # FILL: e.g. connect.<region>.seetacloud.com
port = 0 # FILL: the mapped ssh port from the console
user = "root" # AutoDL containers are always root
key = "" # empty = generated at ~/.config/shunt/keys/<name>
password = "" # optional: enables unattended sshpass ssh-copy-id key deploy

# facts is filled by `shunt client probe`/`bootstrap`; leave empty.
[facts]
# expire = "2026-02-01T00:00:00+08:00"  # subscription end (with offset)
# expire = "unlimited"                  # owned box: never expires
#
# Optional: cost metadata surfaced to the agent (design.md §9).
# [billing]
# hourly = 2.6
# currency = "cny"
